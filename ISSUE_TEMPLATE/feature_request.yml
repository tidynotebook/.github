name: Feature request
description: Ask for a specific change to the product.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For an idea that is not yet specific, start in **Share an idea** on the previous page.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Tell what you cannot do now, and why it is important to you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tell what the product does after the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Tell what you do now, or what other applications do.
